<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hello-word-21</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .greeting {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 6rem);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -0.04em;
      text-align: center;
      color: var(--fg);
    }
  </style>
</head>
<body>
  <main aria-label="Centered greeting screen">
    <h1 class="greeting">Hello Word</h1>
  </main>
</body>
</html>
